name: Aggiornamento Prezzi Automatico

on:
  schedule:
    - cron: '0 3 * * *' # Parte automaticamente ogni notte alle 03:00
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4

      - name: Esegui Scraper
        run: |
          python scraper.py

      - name: Salva e carica le modifiche nel repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Automated price update" || exit 0
          git push
