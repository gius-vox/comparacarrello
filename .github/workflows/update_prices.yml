name: Aggiornamento Prezzi Automatico

on:
  schedule:
    - cron: '0 3 * * *'  # Esegue ogni notte alle 03:00 UTC
  workflow_dispatch:      # Permette l'avvio manuale

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Esegui Scraping
        run: python scraper.py

      - name: Salva modifiche nel file CSV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prodotti.csv
          git commit -m "Auto-update prezzi farmacie [skip ci]" || echo "Nessuna modifica da salvare"
          git push origin main
