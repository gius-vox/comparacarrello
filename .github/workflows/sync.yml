name: Sincronizzazione Catalogo Awin on: schedule: - cron: '0 3 * * *' workflow_dispatch: jobs: sync: runs-on: ubuntu-latest steps: - name: Scarica il codice del repository uses: actions/checkout@v4 - name: Configura Python uses: actions/setup-python@v5 with: python-version: '3.11' - name: Installa le librerie necessarie run: | python -m pip install --upgrade pip pip install requests pandas supabase - name: Esegui la sincronizzazione su Supabase env: SUPABASE_URL: ${{ secrets.SUPABASE_URL }} SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }} AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }} run: | python sync_awin.py